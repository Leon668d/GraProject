<section id="system-records" class="records-grid">
    <details class="panel-card records-panel">
        <summary>
            <span>
                <strong>历史任务</strong>
                <small>回看详情、复用结果和下载文件</small>
            </span>
        </summary>
        <div id="history-summary" class="mini-summary-grid">
            <article class="mini-summary-card">
                <span>任务总数</span>
                <strong>--</strong>
            </article>
            <article class="mini-summary-card">
                <span>成功次数</span>
                <strong>--</strong>
            </article>
            <article class="mini-summary-card">
                <span>平均耗时</span>
                <strong>--</strong>
            </article>
            <article class="mini-summary-card">
                <span>最近模型</span>
                <strong>--</strong>
            </article>
        </div>
        <div id="history-list" class="stack-list">
            <div class="empty-block">当前还没有历史任务。可先加载内置样例或上传一对图像。</div>
        </div>
    </details>

    <details class="panel-card records-panel">
        <summary>
            <span>
                <strong>操作日志</strong>
                <small>登录、上传、配准和下载记录</small>
            </span>
        </summary>
        <div id="log-list" class="stack-list">
            <div class="empty-block">暂无操作日志。</div>
        </div>
    </details>
</section>
